name: Release

on:
  push:
    tags: ['v[0-9]*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require a version tag
        env:
          REF_TYPE: ${{ github.ref_type }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          test "$REF_TYPE" = tag
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]

  build:
    needs: validate
    uses: ./.github/workflows/build.yml

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout release notes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download verified builds
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: mwall-macos-*
          path: dist
          merge-multiple: true

      - name: Verify assets and publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          for arch in arm64 x86_64; do
            archive="MWall-${TAG}-macos-${arch}.zip"
            test -s "dist/$archive"
            test -s "dist/$archive.sha256"
            (cd dist && sha256sum --check "$archive.sha256")
          done
          gh release create "$TAG" \
            "dist/MWall-${TAG}-macos-arm64.zip" \
            "dist/MWall-${TAG}-macos-arm64.zip.sha256" \
            "dist/MWall-${TAG}-macos-x86_64.zip" \
            "dist/MWall-${TAG}-macos-x86_64.zip.sha256" \
            --verify-tag --latest \
            --title "MWall $TAG" \
            --notes-file "docs/releases/$TAG.md"
