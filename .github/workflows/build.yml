name: Build

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: macOS ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check architecture and release version
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          test "$(uname -m)" = "$EXPECTED_ARCH"
          swift --version
          if [[ "$REF_TYPE" == tag ]]; then
            [[ "$REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
            version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Resources/Info.plist)
            test "$REF_NAME" = "v$version"
            test -s "docs/releases/$REF_NAME.md"
          fi

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25.x'
          cache: false

      - name: Install Neovim for integration tests
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
        run: |
          if ! command -v nvim >/dev/null; then
            brew install neovim
          fi
          nvim --version

      - name: Build Aether
        run: tools/build_aether.sh

      - name: Test
        run: swift test -c release

      - name: Package and verify application
        run: tools/archive_app.sh

      - name: Upload application and checksum
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mwall-macos-${{ matrix.arch }}
          path: |
            dist/MWall-*.zip
            dist/MWall-*.sha256
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
